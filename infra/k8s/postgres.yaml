apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: oneaboveall
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # local-path (k3s's default StorageClass) doesn't enforce size or
      # support resize — nominal value, actual ceiling is the node's free
      # disk.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oneaboveall
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            # These three bootstrap the postgres:16 image's own initial
            # database/user/password. They must describe the exact same
            # database DATABASE_URL (in oneaboveall-secrets, consumed by the
            # api and migration-job) points at — see infra/README.md.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: oneaboveall-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: oneaboveall-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oneaboveall-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "768Mi"
              cpu: "750m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oneaboveall
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
