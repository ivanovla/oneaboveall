# Mounted into the stock nginx:alpine image via a ConfigMap (see
# infra/k8s/web.yaml) — no custom nginx image needed. Serves purely from
# the shared volume the web-rebuilder container populates; see that
# container's rebuild-server.mjs for how /shared/current is published.
server {
    listen 80;
    server_name _;
    root /shared/current;
    index index.html;

    # Astro fingerprints hashed filenames under /_astro/ (a new build
    # publishes new filenames, never reuses an old one) — safe to cache
    # forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else — index.html above all — must never be cached: the
    # entire point of the rebuild pipeline (see rebuild-server.mjs) is that
    # index.html changes every time the champion changes, and a cached copy
    # would defeat it silently.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
